<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="srmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="14" fill="url(#srmGrad)"/>
  
  <!-- Graph Road Edges -->
  <path d="M14 48 Q 24 20, 36 34 T 50 16" fill="none" stroke="#60a5fa" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M14 48 Q 24 20, 36 34 T 50 16" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2,3"/>

  <!-- Graph Nodes -->
  <circle cx="14" cy="48" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="36" cy="34" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="50" cy="16" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Emergency Beacon Pulse on Node 50,16 -->
  <circle cx="50" cy="16" r="9" fill="none" stroke="#fca5a5" stroke-width="1.5" opacity="0.8"/>
</svg>
